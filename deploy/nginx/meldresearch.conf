# Meld Research remote backend: https://www.meldresearch.org -> 127.0.0.1:8080
# Reference site: install it once by hand to /etc/nginx/sites-available/ (README "Server setup").
# Certificates are issued by certbot (webroot) under the "www.meldresearch.org" lineage.

# Query strings and referrers can carry OAuth and device-approval codes: log paths only.
log_format meldresearch_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                                '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream meldresearch_remote {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.meldresearch.org meldresearch.org;
    server_tokens off;
    access_log /var/log/nginx/meldresearch.access.log meldresearch_private;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://www.meldresearch.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meldresearch.org;
    server_tokens off;
    access_log /var/log/nginx/meldresearch.access.log meldresearch_private;

    ssl_certificate     /etc/letsencrypt/live/www.meldresearch.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.meldresearch.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.meldresearch.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.meldresearch.org;
    server_tokens off;
    access_log /var/log/nginx/meldresearch.access.log meldresearch_private;

    ssl_certificate     /etc/letsencrypt/live/www.meldresearch.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.meldresearch.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MeldResearchTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Matches ResearchEvidence.MaxRequestBytes (3 MiB); Kestrel enforces the same limit.
    client_max_body_size 3m;

    location / {
        proxy_pass http://meldresearch_remote;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The backend rejects any Host other than its PublicOrigin host.
        proxy_set_header Host $host;
        # Only X-Forwarded-Proto/For from loopback are trusted; overwrite, never append.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        # Research analysis may take several minutes (local client deadline: 4 minutes).
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
