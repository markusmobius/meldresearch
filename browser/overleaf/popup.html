<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meld Overleaf connection</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1><img class="brand-icon" src="icons/icon-48.png" width="32" height="32" alt="">Meld Research</h1>
  <p>Connects Overleaf to Meld Research. Requires the Meld Research desktop application.</p>
  <p id="status" role="status">Checking Overleaf sign-in...</p>
  <button id="overleaf" class="primary" type="button" hidden>Sign in to Overleaf</button>
  <button id="connect" class="primary" type="button" hidden>Connect</button>
  <button id="disconnect" type="button" hidden>Disconnect</button>
  <small>Read-only access. Cookies stay in your browser. Disconnecting is remembered after a browser restart.</small>
  <p class="privacy-link"><a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy and data use</a></p>
  <script src="popup.js"></script>
</body>
</html>
